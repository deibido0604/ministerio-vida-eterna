<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="%PUBLIC_URL%/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png">
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1e40af" />
    <meta name="description" content="Ministerio Vida Eterna - Un lugar de encuentro con Dios" />
    <meta property="og:title" content="Ministerio Vida Eterna - Campamento Vida Eterna" />
    <meta property="og:description" content="Transformamos vidas a través del amor de Cristo." />
    <meta property="og:image" content="%PUBLIC_URL%/og-image.jpg" />
    <meta property="og:url" content="https://ministeriovidaeterna.org" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="keywords" content="iglesia, ministerio, cristiano, evangelio, Honduras" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
    <title>Ministerio Vida Eterna | Campamento Vida Eterna</title>
    <style>
      #root-loading { display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #1e40af 0%, #3b82f6 100%); color: white; font-family: 'Inter', sans-serif; }
      img { max-width: 100%; height: auto; }
      :focus { outline: 2px solid #3b82f6; outline-offset: 2px; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
      .loading-spinner { animation: pulse 1.5s ease-in-out infinite; }
    </style>
    
    <!-- PARTE 1: SDK de PayPal (solo hosted-buttons) -->
    <script
      src="https://www.paypal.com/sdk/js?client-id=BAA-9UWod6JzuQiExo9bgB8p8HS5eaoa1eUO4jfgRrm8COM1wKXTXurArrrf_tYdo8Ref1LEIk24pinUG8&components=hosted-buttons&disable-funding=venmo&currency=USD"
      crossorigin="anonymous"
      async>
    </script>
  </head>
  <body>
    <div id="root-loading" style="display: none;">
      <div class="loading-spinner" style="text-align: center;">
        <div style="font-size: 2rem; margin-bottom: 1rem;">⛪</div>
        <h2 style="font-weight: 600; margin-bottom: 0.5rem;">Ministerio Vida Eterna</h2>
        <p style="opacity: 0.8;">Cargando bendiciones...</p>
      </div>
    </div>
    <noscript>
      <div style="text-align: center; padding: 2rem; background: #f8f9fa; color: #333; font-family: sans-serif; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
        <h1 style="color: #1e40af; font-size: 2rem; margin-bottom: 1rem;">⛪ Ministerio Vida Eterna</h1>
        <p style="font-size: 1.2rem; max-width: 600px; margin-bottom: 2rem;">Para disfrutar de nuestra página web, necesitas habilitar JavaScript en tu navegador.</p>
        <div style="background: white; padding: 2rem; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
          <h2 style="color: #1e40af; margin-bottom: 1rem;">Información de contacto</h2>
          <p><strong>📍 Dirección:</strong> Calle de la Fe, Honduras</p>
          <p><strong>📞 Teléfono:</strong> +504 XXXX-XXXX</p>
          <p><strong>🕐 Horarios:</strong> Domingos 9:00 AM y 6:00 PM</p>
          <p style="margin-top: 1.5rem; font-style: italic;">"Venid a mí todos los que estáis trabajados y cargados, y yo os haré descansar."<br><strong>Mateo 11:28</strong></p>
        </div>
      </div>
    </noscript>
    <div id="root"></div>

    <!-- PARTE 2: Inicialización del botón hospedado (espera a que exista el div y PayPal esté listo) -->
    <script>
      (function() {
        var maxAttempts = 40;      // 40 * 300ms = 12 segundos
        var attempt = 0;
        var interval = null;

        function tryRender() {
          var container = document.getElementById("paypal-container-KBCZAYJMPPZHQ");
          var isPaypalReady = window.paypal && window.paypal.HostedButtons;

          if (container && isPaypalReady) {
            clearInterval(interval);
            try {
              window.paypal.HostedButtons({
                hostedButtonId: "KBCZAYJMPPZHQ"
              }).render("#paypal-container-KBCZAYJMPPZHQ");
              console.log("✅ Botón de PayPal renderizado correctamente");
            } catch (err) {
              console.error("❌ Error al renderizar el botón:", err);
            }
          } else {
            attempt++;
            if (attempt >= maxAttempts) {
              clearInterval(interval);
              console.error("❌ No se pudo renderizar el botón de PayPal después de", maxAttempts, "intentos.");
              if (!container) console.error("   - El contenedor #paypal-container-KBCZAYJMPPZHQ no existe en el DOM");
              if (!isPaypalReady) console.error("   - PayPal HostedButtons no está disponible");
              // Opcional: mostrar un mensaje de error al usuario
              var containerElem = document.getElementById("paypal-container-KBCZAYJMPPZHQ");
              if (containerElem) {
                containerElem.innerHTML = '<p class="text-red-600">No se pudo cargar el botón de PayPal. Recarga la página o intenta más tarde.</p>';
              }
            }
          }
        }

        interval = setInterval(tryRender, 300);
      })();
    </script>

    <script>
      document.getElementById('root-loading').style.display = 'flex';
      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
          var loadingDiv = document.getElementById('root-loading');
          if (loadingDiv) loadingDiv.style.display = 'none';
        }, 500);
      });
      window.isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (window.isMobile) document.body.classList.add('mobile-device');
    </script>
  </body>
</html>
